name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Build (includes the client secret check)
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://fauotybbzqlerctitcsc.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

  database-and-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start the local Supabase stack
        run: npx supabase start -x studio,imgproxy,vector,logflare,supavisor,edge-runtime,postgres-meta
      - name: RLS and database tests (pgTAP)
        run: npx supabase test db
      - name: Write local environment
        run: node scripts/local-env.mjs
      - run: npx playwright install --with-deps chromium
      - name: End to end tests at 375 and 1280 px
        run: npx playwright test
        env:
          CI: 'true'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
